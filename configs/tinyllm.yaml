data:
  dataset_name: codelion/fineweb-edu-100M
  dataset_revision: null
  cache_dir: data/cache
  output_dir: data/processed
  text_field: text
  validation_fraction: 0.01
  seed: 1337

tokenizer:
  vocab_size: 16384
  min_frequency: 2
  special_tokens: ["<unk>", "<bos>", "<eos>", "<pad>"]
  path: data/tokenizer.json

model:
  vocab_size: 16384
  max_seq_len: 512
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5

training:
  seed: 1337
  device: cuda
  precision: bf16
  micro_batch_size: 16
  gradient_accumulation_steps: 8
  max_steps: 10000
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 500
  weight_decay: 0.1
  max_grad_norm: 1.0
  compile: false
  checkpoint_dir: checkpoints

logging:
  run_dir: runs
  log_interval: 10
  validation_interval: 500
  checkpoint_interval: 1000

generation:
  max_new_tokens: 128
  temperature: 1.0
  top_k: null
  top_p: 1.0
  seed: 1337

quantization:
  recipe: null
  output_dir: exports
