[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tinyllm"
version = "0.1.0"
description = "A compact decoder-only language model trained from scratch."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.34",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "tensorboard>=2.18",
    "tokenizers>=0.20",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
fp8 = ["torchao==0.18.0"]

[project.scripts]
tinyllm = "tinyllm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires a compatible CUDA device and optional GPU dependencies",
]
filterwarnings = [
    'ignore:^`torch\.jit\.script_method` is deprecated\. Please switch to `torch\.compile` or `torch\.export`\.$:DeprecationWarning:^torch\.jit\._script$',
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
